<style>
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* layout: one full-height column. Slim top line, editor fills the rest, a quiet bar floats at the bottom and hides while typing. Chapters slide in from the left, tools rise from the bottom. */
:root{--bg:#ffffff;--fg:#1a1a1a;--mute:#73736f;--line:#e6e6e3;--acc:#2f4a7a;--onacc:#ffffff;--accbg:#e9eef7;--sheet:#f6f6f4;--scrim:rgba(0,0,0,.32);--danger:#a33a2f;--hl:#fbeeb8;
--ed-font:'Hiragino Mincho ProN','Hiragino Mincho Pro','Yu Mincho','YuMincho','BIZ UDPMincho','BIZ UDMincho','Noto Serif JP','Noto Serif CJK JP','Source Han Serif JP','MS PMincho',serif;--ed-size:17px;--ed-lh:2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#e8e8e5;--mute:#9a9a94;--line:#2c2c2a;--acc:#9db4e0;--onacc:#14202f;--accbg:#232b3a;--sheet:#1f1f1e;--scrim:rgba(0,0,0,.55);--danger:#e08a80;--hl:#4a4325;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161616;--fg:#e8e8e5;--mute:#9a9a94;--line:#2c2c2a;--acc:#9db4e0;--onacc:#14202f;--accbg:#232b3a;--sheet:#1f1f1e;--scrim:rgba(0,0,0,.55);--danger:#e08a80;--hl:#4a4325;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','YuGothic','Meiryo','Noto Sans JP','Noto Sans CJK JP','Source Han Sans JP',sans-serif;font-size:15px;line-height:1.6;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ib{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;color:var(--mute);border-radius:8px;padding:0}
.ib:active{background:var(--accbg)}
.ib.sm{width:40px;height:40px}
#top{flex:none;height:48px;display:flex;align-items:center;justify-content:space-between;margin:0 -8px}
.ch .rn-in{flex:1;min-width:0;height:40px;margin:0 0 0 2px;background:var(--bg);color:var(--fg);border:1px solid var(--acc);border-radius:8px;font:inherit;font-size:16px;padding:0 8px;outline:0}
#ttl{flex:1;min-width:0;height:48px;background:none;border:0;color:var(--mute);font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
#main{flex:1;min-height:0;position:relative;margin-bottom:54px}
#ed{position:absolute;inset:0;outline:none;white-space:pre-wrap;line-break:strict;overflow-wrap:anywhere;font-family:var(--ed-font);font-size:var(--ed-size);line-height:var(--ed-lh);caret-color:var(--acc);padding:8px var(--ed-mx,0px) 14px;scroll-padding-bottom:14px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
#ed.v{writing-mode:vertical-rl;overflow-x:auto;overflow-y:hidden;padding:8px max(8px,var(--ed-mx,0px)) 14px;scroll-padding-left:max(8px,var(--ed-mx,0px));scroll-padding-right:max(8px,var(--ed-mx,0px))}
#ed:empty::before{content:attr(data-ph);color:var(--mute);font-size:.8em}
#ed::selection{background:var(--accbg)}
#bar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:0;height:54px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);color:var(--mute);font-size:14px;transition:transform .18s ease,opacity .18s ease;z-index:5;margin:0 -8px;padding:0 8px 0 8px}
#cnt{font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar .ic{display:flex;flex:none}
#bar .ib{width:42px;height:46px}
#bar #fmt{display:none;gap:4px;align-items:center}
#app.editing #bar #nav{display:none}
#app.editing #bar #fmt{display:flex;flex:1}
#app.editing #c2{display:none}
#app.hidetop.editing #top{display:none}
#reveal{display:none;position:absolute;top:0;left:50%;transform:translateX(-50%);width:80px;height:24px;background:none;border:0;padding:0;z-index:6}
#reveal::before{content:"";position:absolute;left:50%;top:9px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--mute)}
#app.hidetop.editing #reveal{display:block}
#app.hidetop.editing #ed{padding-top:26px}
.tb{height:42px;min-width:56px;padding:0 12px;border:.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font-size:15px}
.tb:active{background:var(--accbg)}
@media (max-width:419px){#app.editing #cnt{display:none}}
#scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:absolute;top:0;bottom:0;left:0;width:min(84%,320px);background:var(--sheet);z-index:30;display:flex;flex-direction:column;transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;padding-left:max(16px,env(safe-area-inset-left,0px));padding-top:8px}
#drawer.on{transform:none;visibility:visible;transition:transform .22s ease}
@media (hover:hover) and (pointer:fine) and (min-width:760px){#drawer{width:300px}#app.dock-open{padding-left:324px}#app.dock-open #bar{left:324px}#app.dock-open #drawer{z-index:10;border-right:.5px solid var(--line)}}
#dw-file{padding:10px 16px 12px 0;border-bottom:.5px solid var(--line)}
#dw-name{display:flex;align-items:center;min-width:0}
#dw-title{font-size:17px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dw-file small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
#dw-file .facts{display:flex;gap:6px;margin-top:10px}
#dw-file .facts .btn{flex:1;min-width:0;padding-left:6px;padding-right:6px}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px;border-radius:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:8px;flex:none}
.dot[hidden]{display:none}
#bSave{position:relative}#bSave .dot{position:absolute;top:9px;right:9px;margin:0;display:none}#bSave.dirty .dot{display:block}
#dw-list{flex:1;overflow-y:auto;padding:6px 0}
.ch{display:flex;align-items:center;border-radius:8px;margin-right:8px}
.ib.sm.ex{background:var(--accbg)}
#dw-foot .btn.lnk.sm{min-height:36px;padding:6px 8px;font-size:13px;align-self:flex-start}
.ch.sel{background:var(--accbg);color:var(--acc)}
.chm{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;flex:1;min-width:0;display:flex;justify-content:space-between;gap:8px;align-items:baseline;background:none;border:0;padding:12px 8px;text-align:left;font-size:16px}
.chm .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib.xs{width:30px;height:40px;flex:none}
.ib.xs:disabled{opacity:.28}
.ib.xs .i{width:20px;height:20px}
.ch .cc{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;flex:none;min-width:30px;padding:0 2px 0 6px;text-align:right;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.ch.sel .cc{color:var(--acc)}
#pmask{position:absolute;inset:0;z-index:59}
#pmenu{position:absolute;z-index:60;width:224px;max-height:calc(100% - 16px);overflow-y:auto;background:var(--bg);color:var(--fg);border:.5px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.25);padding:4px}
#pmenu .ph{padding:6px 10px 4px;font-size:12px;color:var(--mute)}
#pmenu .it{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:7px 10px;border:0;background:none;color:inherit;font:inherit;font-size:14.5px;text-align:left;border-radius:8px}
#pmenu .it .i{width:20px;height:20px;color:var(--mute);flex:none}
#pmenu .it:hover,#pmenu .it:focus-visible{background:var(--accbg)}
#pmenu .it:disabled{opacity:.38}
#pmenu .it.dg,#pmenu .it.dg .i{color:var(--danger)}
#pmenu hr{border:0;border-top:.5px solid var(--line);margin:3px 6px}
.chm .cc{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.ch.sel .chm .cc{color:var(--acc)}
.ch .h{touch-action:none;cursor:grab;color:var(--mute);width:40px;height:40px;display:grid;place-items:center}
.ch.drag{background:var(--accbg)}
#rnd{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--scrim)}
#rnd .card{width:min(100%,360px);box-sizing:border-box;background:var(--sheet);color:var(--fg);border:.5px solid var(--line);border-radius:16px;padding:18px 16px 16px;box-shadow:0 8px 32px rgba(0,0,0,.25)}
#rnd h2{margin:0 0 10px;font-size:16px;font-weight:600}
#rnd input{width:100%;box-sizing:border-box;height:46px;padding:0 12px;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--acc);border-radius:10px;outline:0}
#rnd .acts{margin:14px 0 0}
#rnd p{margin:0;font-size:14px;line-height:1.7}
#rnd p.sub{margin-top:8px;font-size:13px;color:var(--mute)}
#rnd .btn.dngf{background:var(--danger);border-color:var(--danger);color:var(--onacc)}
#drawer.kbmode #dw-file,#drawer.kbmode #dw-foot{display:none}
#dw-foot{padding:10px 16px 12px 0;border-top:.5px solid var(--line);display:flex;flex-direction:column;gap:8px}
#dw-total{color:var(--mute);font-size:13px}
#dw-foot .hint{color:var(--mute);font-size:13px}
.btn{padding:12px 16px;border:.5px solid var(--line);background:var(--bg);border-radius:10px;font-size:15px;line-height:1.3;min-height:48px}
.btn.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn.dng{color:var(--danger)}
.btn.lnk{border-color:transparent;background:none;color:var(--acc)}
.btn.add{display:flex;align-items:center;gap:6px;color:var(--acc);justify-content:center}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:84%;background:var(--sheet);border-radius:14px 14px 0 0;z-index:40;display:flex;flex-direction:column;transform:translateY(102%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#sheet.on{transform:none;visibility:visible;transition:transform .22s ease}
#sh-h{display:flex;align-items:center;justify-content:space-between;height:54px;flex:none}
#sh-t{font-size:17px;font-weight:500}
#sh-b{overflow-y:auto;padding:0 0 max(18px,env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sec{font-size:13px;color:var(--mute);margin:20px 0 2px;letter-spacing:.04em}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:.5px solid var(--line);font-size:15px}
.row small{display:block;color:var(--mute);font-size:13px;line-height:1.5}
.row>span{min-width:0}
.seg{display:flex;border:.5px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{background:var(--bg);border:0;padding:10px 14px;font-size:14px;border-left:.5px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accbg);color:var(--acc)}
select{background:var(--bg);border:.5px solid var(--line);border-radius:8px;padding:10px 10px;font-size:14px;max-width:62%}
input[type=range]{width:46%;accent-color:var(--acc)}
input[type=text],input[type=date]{width:100%;font-size:16px;padding:9px 10px;border:.5px solid var(--line);border-radius:8px;background:var(--bg)}
input.sw{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;margin:0;transition:background .15s}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--bg);transition:transform .15s}
input.sw:checked{background:var(--acc)}
input.sw:checked::after{transform:translateX(16px)}
.fl{display:block;font-size:13px;color:var(--mute);margin:12px 0 0}
.fl input{margin-top:4px;color:var(--fg)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.acts .btn{flex:1 1 140px}
.sub{color:var(--mute);font-size:13px;line-height:1.6;margin:10px 0 0}
.hit{padding:12px 0;border-bottom:.5px solid var(--line);font-size:15px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;display:block}
.hit small{display:block;color:var(--mute);font-size:13px}
.hit mark,.dv mark{background:var(--hl);color:inherit;border-radius:2px}
.xrow{display:flex;gap:8px}
.xrow .btn{flex:1}
#prev{position:absolute;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#pv-top{display:flex;justify-content:flex-end;height:48px;flex:none;margin:0 -8px}
#pv{flex:1;min-height:0;overflow:auto;font-family:var(--ed-font);font-size:var(--ed-size);line-height:2.1;padding:6px 0 24px;overflow-wrap:anywhere;line-break:strict}
#pv.v{writing-mode:vertical-rl;overflow-x:auto;overflow-y:hidden}
#pv p{margin:0;min-height:1em}
#pv rt{font-size:.5em}
#pv em{font-style:normal;text-emphasis:filled sesame;-webkit-text-emphasis:filled sesame}
#toast{position:absolute;left:50%;bottom:70px;transform:translate(-50%,12px);max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.5;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--bg);text-decoration:underline;padding:6px 4px;font-size:14px;flex:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:0s!important}}
</style>
</head>

<div id="app">
  <div id="top">
    <button class="ib" id="bMenu" aria-label="章の一覧を開く"><svg class="i"><use href="#i-menu"/></svg></button>
    <button id="ttl" aria-label="章の名前を変える"></button>
    <button class="ib" id="bSave" aria-label="保存"><svg class="i"><use href="#i-save"/></svg><i class="dot"></i></button>
    <button class="ib" id="bFile" aria-label="ファイルと書き出し"><svg class="i"><use href="#i-file"/></svg></button>
    <button class="ib" id="bHist" aria-label="履歴"><svg class="i"><use href="#i-clock"/></svg></button>
    <button class="ib" id="bSet" aria-label="設定を開く"><svg class="i"><use href="#i-sliders"/></svg></button>
  </div>
  <button id="reveal" aria-label="上のメニューを表示"></button>
  <div id="main"><div id="ed" data-ph="" role="textbox" aria-multiline="true" aria-label="本文" lang="ja" spellcheck="false" autocapitalize="off" autocorrect="off"></div></div>
  <div id="bar">
    <span id="cnt"><span id="c1"></span><span id="c2"></span></span>
    <span class="ic" id="nav">
      <button class="ib" id="bUndo" aria-label="元に戻す"><svg class="i"><use href="#i-undo"/></svg></button>
      <button class="ib" id="bRedo" aria-label="やり直す"><svg class="i"><use href="#i-redo"/></svg></button>
      <button class="ib" id="bFind" aria-label="検索と置換"><svg class="i"><use href="#i-search"/></svg></button>
      <button class="ib" id="bDir" aria-label="縦書きに切り替え"><svg class="i"><use href="#i-tate"/></svg></button>
    </span>
    <span class="ic" id="fmt">
      <button class="ib" id="bMenu2" aria-label="章の一覧を開く" style="margin-right:auto"><svg class="i"><use href="#i-menu"/></svg></button>
      <button class="tb" id="bRuby" aria-label="ルビをつける">ルビ</button>

/* ===== 作品=1つのtxtファイル。パソコンでは同じファイルへ上書き保存(File System Access API)、対応しない端末では共有/ダウンロード ===== */
var FS=!!(window.showOpenFilePicker&&window.showSaveFilePicker&&window.indexedDB&&window.isSecureContext);
var FH={};
var TXT_T=[{description:'テキストファイル',accept:{'text/plain':['.txt']}}];
function idb(){return new Promise(function(res,rej){var q=indexedDB.open('algernon-fh',1);q.onupgradeneeded=function(){q.result.createObjectStore('h')};q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})}
function hPut(id,h){FH[id]=h;return idb().then(function(db){return new Promise(function(res){var t=db.transaction('h','readwrite');t.objectStore('h').put(h,id);t.oncomplete=function(){res(true)};t.onerror=function(){res(false)}})}).catch(function(){return false})}
function hGet(id){if(FH[id])return Promise.resolve(FH[id]);return idb().then(function(db){return new Promise(function(res){var r=db.transaction('h').objectStore('h').get(id);r.onsuccess=function(){if(r.result)FH[id]=r.result;res(r.result||null)};r.onerror=function(){res(null)}})}).catch(function(){return null})}
function hDel(id){delete FH[id];return idb().then(function(db){return new Promise(function(res){var t=db.transaction('h','readwrite');t.objectStore('h').delete(id);t.oncomplete=function(){res()};t.onerror=function(){res()}})}).catch(function(){})}
function hash32(t){var h=5381;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return h}
function stripExt(n){return String(n||'').replace(/\.(txt|text)$/i,'')||'無題の作品'}
function hhmm(t){var d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}
async function grant(h,mode){var o={mode:mode};try{if((await h.queryPermission(o))==='granted')return true;return (await h.requestPermission(o))==='granted'}catch(e){return false}}

  t=t.replace(/^﻿/,'');var crlf=/\r\n/.test(t);t=t.replace(/\r\n?/g,'\n');return {text:t,crlf:crlf,sj:sj}}

/* 状態 */

/* 保存。FS対応:同じファイルへ上書き / 非対応:共有メニューかダウンロード */
async function saveWork(asNew){var w=W(),txt=workToTxt(w),crlf=!!(w.link&&w.link.crlf);
  var out=crlf?txt.replace(/\n/g,'\r\n'):txt;
  if(!FS){var nm=(w.link&&w.link.name)||safeName(w.title)+'.txt';
    var ok=await saveFile(nm,out);if(!ok)return {ok:false};
    w.link={name:nm,hs:hash32(txt),at:now(),crlf:crlf,noHandle:true};persist();updateSaveUI();return {ok:true,picker:false}}
  var h=asNew?null:await hGet('work'),picker=false;
  try{
    if(!h){var sug=(w.link&&w.link.name)||safeName(w.title)+'.txt';h=await showSaveFilePicker({suggestedName:sug,types:TXT_T});picker=true;await hPut('work',h)}
    else{
      if(!(await grant(h,'readwrite'))){toast('ファイルへの書き込みが許可されませんでした');return {ok:false}}
      var cur=await h.getFile();
      if(w.link&&w.link.mod&&cur.lastModified!==w.link.mod){
        var i=await ask('ファイルが更新されています','このファイルは、最後に保存したあと、別の場所で更新されています。\n上書きすると、その変更は失われます。',['上書きする','やめる']);
        if(i!==0){if(i===1)toast('上書き保存を中止しました');return {ok:false}}}}
    var wr=await h.createWritable();await wr.write(new Blob([out],{type:'text/plain'}));await wr.close();
    var f2=await h.getFile();w.link={name:h.name,mod:f2.lastModified,hs:hash32(txt),at:now(),crlf:crlf};
    if(picker)w.title=stripExt(h.name);

  catch(e){if(e&&e.name==='AbortError')return {ok:false};
    if(e&&e.name==='NotFoundError'){toast('元のファイルが見つかりません。「名前を付けて保存」で保存先を選び直してください');return {ok:false}}
    toast('保存できませんでした');return {ok:false}}}

/* ファイルから読み込み直す(章の名前が同じなら、元の本文は履歴に残す) */
async function reloadFromFile(){var w=W(),h=await hGet('work');

    var chs=parsed.map(function(p){var old=w.chs.filter(function(c){return !used[c.id]&&c.title===p.title})[0];

      var n=newChapter(p.title);n.text=p.text;return n});
    w.chs=chs;if(!chs.some(function(c){return c.id===w.cur}))w.cur=chs[0].id;w.at=now();UH={};
    w.link={name:h.name,mod:f.lastModified,at:now(),crlf:r.crlf};w.link.hs=hash32(workToTxt(w));extSeen=f.lastModified;
    persist();renderAll();closeLayers();toast('ファイルの内容に読み込み直しました')}
  catch(e){toast('ファイルを読み込めませんでした')}}

/* 古い形式(複数作品)からの移行 */
function legacyName(x,used){var b=safeName(x.title),n=b,k=2;while(used[n.toLowerCase()]){n=b+' ('+k+')';k++}used[n.toLowerCase()]=1;return n+'.txt'}

    +'<div class="acts"><button class="btn dng" id="m-fin">移行を終えて、古いデータを消す</button><button class="btn" id="m-later">あとで</button></div>';

      if(i!==0)return;D.legacy=[];persist();updateSaveUI();toast('古いデータを消しました')}})}

/* 日記用HTML(サイトの diary_paragraphs_YYYY-MM-DD.html)を書き出す */
function diarySheet(){var w=W(),t=new Date(),ds=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
  sheet('日記用HTMLで保存','<label class="fl">日記の日付<input id="dd" type="date" value="'+ds+'"></label><p class="sub" id="dn"></p><div class="acts"><button class="btn pri" id="dsave">保存</button></div>'
    +'<p class="sub">1行を1段落にします(空行は段落になりません)。段落の頭に全角スペースを付け、ルビと傍点はサイトの書き方に変えます。章が複数あるときは、章の見出しを除いて、本文を順に並べます。保存したファイルを、ビルド用フォルダに置いて build.bat を実行すると、サイトの日記になります。</p>',function(r){
    var dd=r.querySelector('#dd'),dn=r.querySelector('#dn');
    function nm(){return /^\d{4}-\d{2}-\d{2}$/.test(dd.value)?'diary_paragraphs_'+dd.value+'.html':''}
    function show(){dn.textContent=nm()?'ファイル名: '+nm():'日付を選んでください'}
    dd.addEventListener('input',show);show();
    r.querySelector('#dsave').onclick=async function(){var n=nm();if(!n){toast('日付を選んでください');return}
      var html=diaryHtml(w.chs);if(!html){toast('本文がありません');return}
      if(!FS){if(await saveFile(n,html))closeLayers();return}
      try{var h=await showSaveFilePicker({suggestedName:n,id:'algernon-diary',types:[{description:'HTMLファイル',accept:{'text/html':['.html']}}]});
        var wr=await h.createWritable();await wr.write(new Blob([html],{type:'text/html'}));await wr.close();closeLayers();toast('「'+h.name+'」に保存しました')}
      catch(e){if(e&&e.name==='AbortError')return;toast('保存できませんでした')}}})}

function previewOpen(){closeLayers();var h='';C().text.replace(/\n+$/,'').split('\n').forEach(function(l){h+='<p>'+(l.trim()===''?'&nbsp;':parseLine(l).map(function(p){return p.t==='x'?esc(p.s):p.t==='e'?'<em>'+esc(p.s)+'</em>':'<ruby>'+esc(p.b)+'<rt>'+esc(p.r)+'</rt></ruby>'}).join(''))+'</p>'});
  var pv=$('pv');pv.innerHTML=h||'<p>(本文がありません)</p>';pv.classList.toggle('v',D.s.dir==='v');$('prev').hidden=false;pv.scrollTop=0;pv.scrollLeft=0;$('pv-x').focus({preventScroll:true})}

function seg(k,opts){return '<div class="seg" data-k="'+k+'">'+opts.map(function(o){return '<button data-v="'+o[0]+'" aria-pressed="'+(String(D.s[k])===String(o[0]))+'">'+o[1]+'</button>'}).join('')+'</div>'}
function sw(k,label,sub){return '<label class="row"><span>'+label+(sub?'<small>'+sub+'</small>':'')+'</span><input type="checkbox" class="sw" role="switch" data-k="'+k+'"'+(D.s[k]?' checked':'')+'></label>'}
function sel(k,opts){return '<select data-k="'+k+'" aria-label="'+k+'">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(String(D.s[k])===String(o[0])?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>'}
function setSetting(k,v){D.s[k]=v;if(k==='cm'){updateCount();renderDrawer()}applyView();persist();if(k==='dir'||k==='lh'||k==='size'||k==='font'){}}
function mxLabel(v){return v?v+'px':'なし'}
function settingsSheet(){
  var h='<div class="sec">表示</div>'
   +'<div class="row"><span>画面の明るさ</span>'+seg('theme',[['a','自動'],['l','ライト'],['d','ダーク']])+'</div>'
   +'<div class="row"><span>書き方</span>'+seg('dir',[['h','横書き'],['v','縦書き']])+'</div>'
   +'<div class="row"><span>フォント</span>'+seg('font',[['m','明朝'],['g','ゴシック']])+'</div>'
   +'<div class="row"><span>文字の大きさ<small id="szv">'+D.s.size+'px</small></span><input type="range" min="14" max="28" step="1" value="'+D.s.size+'" data-k="size" aria-label="文字の大きさ"></div>'
   +'<div class="row"><span>行間</span>'+seg('lh',[['2','ゆったり'],['1.8','標準'],['1.55','詰める']])+'</div>'
   +'<div class="row"><span>左右の余白<small id="mxv">'+mxLabel(D.s.mx||0)+'</small></span><input type="range" min="0" max="320" step="8" value="'+(D.s.mx||0)+'" data-k="mx" aria-label="左右の余白"></div><p class="sub">画面の左右に余白をつくります。横書きでは、画面が広いときに文章が横に伸びすぎるのを防げます。縦書きでは、最初の行と最後の行が画面の端にくっつかなくなります。画面が狭いときは自動で小さくなります。</p>'
   +sw('hidetop','入力中は上のメニューと章名を隠す','下の段の「✓」を押すと戻ります')
   +sw('temph','入力中だけ横書きで表示','縦書きで書くとき、キーボードを開いている間だけ横書きになります')
   +sw('vkeys','縦書きのとき左右キーで文字単位に動かす','左右キーが上下キーと同じ動き(文字ごとの移動)になります。縦書きのときだけ働きます')
   +sw('vkeyrev','左右キーの向きを逆にする','初期設定は、右キーで次の文字(下へ)、左キーで前の文字(上へ)です')
   +'<div class="sec">ルビと傍点の入力</div><p class="sub">文字を選んで下の「ルビ」「傍点」を押します。漢字を打ったあとに「ルビ」を押すと、直前の漢字にルビがつきます。かっこの中に読みを入れてください。</p>'
   +'<div class="sec">文字数</div><div class="row"><span>数え方</span>'+sel('cm',[['ns','空白・改行を除く'],['nl','改行を除く'],['all','すべて含む']])+'</div><p class="sub">ルビの読みと記号は数えません。原稿用紙は400字詰め(20字×20行)で換算します。</p>'
   +'<div class="sec">書き出しの整形</div>'
   +sw('ind','段落の頭に全角スペースを入れる','「 『 などで始まる行は入れません')
   +sw('blank','段落の間に空行を入れる')
   +'<div class="row"><span>ルビ・傍点</span>'+sel('ruby',[['keep','そのまま(|漢字《かんじ》)'],['paren','括弧書きにする'],['strip','外す']])+'</div>'
   +sw('titles','全章を1つにするとき章タイトルを入れる')
   +'<div class="row"><span>章の区切り</span>'+sel('sep',[['blank','空行'],['star','* * *']])+'</div>'
   +'<div class="sec">保存について</div>'
   +'<p class="sub">作品の本体は、txtファイルです。上の段の保存ボタン(またはCtrl+S)で保存します。作品は、この端末にも自動で一時保存されますが、端末の初期化や、アプリ・ブラウザのデータの削除で失われることがあるので、txtファイルで保存しておいてください。</p>'
   +'<div class="sec">バージョン</div><div class="row"><span>Algernon<small>新しい版に更新されたかの目安です</small></span><span>v'+APP_V+'</span></div>';
  sheet('設定',h,function(r){
    r.querySelectorAll('.seg').forEach(function(g){g.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var k=g.dataset.k,v=b.dataset.v;if(k==='lh')v=parseFloat(v);setSetting(k,v);g.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})})});
    r.querySelectorAll('input.sw').forEach(function(i){i.addEventListener('change',function(){setSetting(i.dataset.k,i.checked)})});
    r.querySelectorAll('select').forEach(function(s){s.addEventListener('change',function(){setSetting(s.dataset.k,s.value)})});
    r.querySelector('input[data-k=size]').addEventListener('input',function(e){var v=+e.target.value;D.s.size=v;r.querySelector('#szv').textContent=v+'px';applyView();schedSave()});
    r.querySelector('input[data-k=mx]').addEventListener('input',function(e){var v=+e.target.value;D.s.mx=v;r.querySelector('#mxv').textContent=mxLabel(v);applyView();schedSave()});
    })}

$('bUndo').addEventListener('click',undo);$('bRedo').addEventListener('click',redo);
$('bFind').addEventListener('click',findSheet);$('bHist').addEventListener('click',histSheet);$('bFile').addEventListener('click',outSheet);$('bSet').addEventListener('click',settingsSheet);
$('bDir').addEventListener('click',function(){D.s.dir=D.s.dir==='v'?'h':'v';applyView();resetScroll();persist()});
[].forEach.call(document.querySelectorAll('#bar button,#top .ib'),function(b){b.addEventListener('pointerdown',function(e){if(document.activeElement===ed)e.preventDefault()})});

ed.addEventListener('focus',function(){app.classList.add('editing')});
ed.addEventListener('blur',function(){app.classList.remove('editing')});
var KJ=/[\u4e00-\u9fff\u3005\u3006\u30f6]+$/,KJA=/^[\u4e00-\u9fff\u3005\u3006\u30f6]+$/;
function exitEditing(){app.classList.remove('editing');try{ed.blur()}catch(e){}if(tempOn){tempOn=false;applyView()}}
function ins(t){document.execCommand('insertText',false,t)}
function back(n){var s=getSelection();for(var i=0;i<n;i++){try{s.modify('move','backward','character')}catch(e){}}}
function pickBase(){var s=getSelection();if(!s.rangeCount||!ed.contains(s.anchorNode))return null;
  if(!s.isCollapsed){var t=s.toString();return t&&t.indexOf('\n')<0?t:''}
  var n=s.anchorNode;if(n.nodeType!==3)return '';var m=n.nodeValue.slice(0,s.anchorOffset).match(KJ);if(!m)return '';
  var r=document.createRange();r.setStart(n,s.anchorOffset-m[0].length);r.setEnd(n,s.anchorOffset);s.removeAllRanges();s.addRange(r);return m[0]}
function addRuby(){ed.focus({preventScroll:true});var b=pickBase();if(!b){toast('ルビをつける文字を1行の中で選ぶか、漢字のあとでタップしてください');return}
  ins((KJA.test(b)?'':'|')+b+'《》');back(1)}
function addEm(){ed.focus({preventScroll:true});var s=getSelection(),b=(s.rangeCount&&ed.contains(s.anchorNode)&&!s.isCollapsed)?s.toString():'';
  if(b.indexOf('\n')>=0){toast('傍点をつける文字を1行の中で選んでください');return}
  if(b)ins('《《'+b+'》》');else{ins('《《》》');back(2)}}
$('bRuby').addEventListener('click',addRuby);$('bEm').addEventListener('click',addEm);
$('bUndo2').addEventListener('click',undo);$('bRedo2').addEventListener('click',redo);
$('bDone').addEventListener('click',exitEditing);
$('reveal').addEventListener('click',exitEditing);
$('bMenu2').addEventListener('click',function(){menuBtn(true)});

/* 縦書き中は、マウスホイールの上下で左右にスクロールする(下へ回すと左へ進む)。トラックパッドの横スクロールや、Ctrl+ホイール(拡大)はそのまま */
function vWheel(el){el.addEventListener('wheel',function(e){
  if(!el.classList.contains('v')||e.ctrlKey||e.metaKey||e.shiftKey||e.deltaY===0||Math.abs(e.deltaX)>=Math.abs(e.deltaY))return;
  var d=e.deltaMode===1?e.deltaY*40:(e.deltaMode===2?e.deltaY*el.clientWidth:e.deltaY);
  el.scrollLeft-=d;e.preventDefault()},{passive:false})}
vWheel(ed);vWheel($('pv'));
ed.addEventListener('keydown',function(e){
  if(!D.s.vkeys||!ed.classList.contains('v')||e.isComposing||e.keyCode===229)return;
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var s=getSelection();if(!s.rangeCount||!s.modify)return;
  var fwd=(e.key==='ArrowRight')!==!!D.s.vkeyrev;
  e.preventDefault();
  s.modify(e.shiftKey?'extend':'move',fwd?'forward':'backward','character');
  var rc=s.getRangeAt(0).getClientRects()[0];if(rc&&(rc.width||rc.height))reveal(s.getRangeAt(0))});

var vv=window.visualViewport;
var kbOpen=false;
/* 章名の入力中にキーボードが出たら、章メニューの上下の枠(ファイル欄・下の操作欄)をたたんで、入力中の行が隠れないようにする */
function fitNaming(open){var f=document.activeElement,on=!!(open&&f&&f.tagName==='INPUT'&&$('dw-list').contains(f));
  if(drawer.classList.contains('kbmode')===on)return;drawer.classList.toggle('kbmode',on);
  if(on){var row=f.closest('.ch'),go=function(){if(row&&document.activeElement===f)row.scrollIntoView({block:'center'})};setTimeout(go,30);setTimeout(go,300)}}
$('dw-list').addEventListener('focusout',function(){setTimeout(function(){fitNaming(false)},0)},true);
function fit(){if(!vv)return;var open=vv.height<window.innerHeight-120;fitNaming(open);if(open){kbOpen=true;var pt=parseFloat(getComputedStyle(document.documentElement).paddingTop)||0;app.style.height=Math.max(160,vv.height-pt)+'px';app.style.transform='translateY('+vv.offsetTop+'px)'}else{if(kbOpen){kbOpen=false;if(app.classList.contains('editing'))exitEditing()}app.style.height='';app.style.transform=''}}
window.addEventListener('resize',fit);
if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit)}

try{ed.setAttribute('contenteditable','plaintext-only');if(ed.contentEditable!=='plaintext-only')ed.contentEditable='true'}catch(e){ed.contentEditable='true'}
renderAll();
if(isDock()&&D.s.dock)openDrawer();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
bindFileUI();updateSaveUI();

})();
