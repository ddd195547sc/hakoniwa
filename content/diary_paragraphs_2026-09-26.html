  <p>　どうも変だ。なにかおかしい。そう思う。そう思っているのに、それがなんなのかわからない。あるいはわかっているのかもしれないが、うまくつかめない。思考が回っていかない。退屈。そう、たいくつ、だ。退屈しているのだが、どうして。わからない。なにに？</p>
              <p>　ここ一月ほどの穴掴りの結果が、単に、退屈、であることもありうるだろうか？　ありうるだろう、とうぜん。しかし、この退屈、には、やはり出口がない。そのように思う。</p>
              <p>　どうしてなにもかもすり抜けていき、砂のように崩れていくのだろう？</p>
              <p>　わからない。すべてはもう終わってしまっていて、ばくはそれをなぞっているだけではないのだろうか？</p>
